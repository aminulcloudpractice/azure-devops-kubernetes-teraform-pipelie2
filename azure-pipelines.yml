trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: SelfHostedPool
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'aminulce06020-docker-hub'
        repository: 'aminulce06020dh/currency-exchange-devops'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: '$(tag)'
